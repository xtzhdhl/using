name: SillyDroid Site Release State

# Fork 覆盖版（放回 fork 仓库的同名路径 .github/workflows/sillydroid-site-release-state.yml）：
# 作者原版会往他的自建站点 sd.jlmaster.online 推发布状态，fork 里没有对应 WriterKey，
# 原样保留只会永远红叉；直接删掉文件又会破坏构建链 publish 步骤里的
# `gh workflow run sillydroid-site-release-state.yml`（按名 dispatch，文件不存在则报错）。
# 所以这里保留文件名与工作流名，内容替换为 no-op，保证主构建链路全绿。
# 想还原上游行为：Sync fork 后选择还原本文件即可。

on:
  workflow_dispatch:
    inputs:
      release_event_action:
        description: 'original event action (ignored on fork)'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  noop:
    # 双保险：即便误在作者仓库运行也直接跳过
    if: github.repository != 'jialmaster/SillyDroid'
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to do on fork
        run: echo "Fork detected; skipping external site state update. input=${{ inputs.release_event_action }}"
